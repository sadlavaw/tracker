<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Life Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f5f5f3;--card:#fff;--tx:#18181b;--mu:#8b8b93;--ln:#ebebe8;--ac:#4c6ef5;--cell:#e8e8e4;--dng:#e03131;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.04)}
[data-theme=dark]{--bg:#0e0e10;--card:#18181b;--tx:#f4f4f5;--mu:#8e8e96;--ln:#26262a;--ac:#748ffc;--cell:#26262b;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
body.kb #nav,body.kb .fab{display:none}
body.kb{padding-bottom:45vh}
#app{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx)}
h1{font-size:26px;margin:0;letter-spacing:-.02em}
h2{font-size:20px;margin:4px 0 14px}
h3{font-size:13px;margin:0 0 12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.hd{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 0 14px;gap:8px}
.hdt{flex:1;text-align:center;font-weight:600;font-size:17px}
.hdt small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.sub{color:var(--mu);font-size:13px;margin-top:2px}
.ib{width:38px;height:38px;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-size:20px;line-height:1}
.ib:disabled{opacity:.3}
.card{background:var(--card);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
.seg{display:flex;background:var(--cell);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-size:13px;color:var(--mu);font-weight:500}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.seg b{font-weight:600;color:var(--ac);margin-left:3px;font-size:12px}
.add{display:flex;gap:8px;margin-bottom:12px}
.inp{width:100%;border:1.5px solid var(--ln);background:var(--card);border-radius:12px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--ac)}
.grow{flex:1}
.row{display:flex;gap:8px;margin:8px 0}
.btn{padding:12px 16px;border-radius:12px;background:var(--cell);font-weight:600}
.btn.pri{background:var(--ac);color:#fff}
.btn.dng{color:var(--dng)}
.btn.ghost{background:none;border:1.5px dashed var(--ln);color:var(--mu)}
.btn.full{width:100%;margin-top:4px}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.task:last-child{border:0}
.task .tt{flex:1;word-break:break-word}
.task.dn .tt{color:var(--mu);text-decoration:line-through}
.task small{display:block;color:var(--dng);font-size:12px}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--mu);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.cb.on{background:var(--ac);border-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.empty .btn{display:block;width:100%;margin-top:10px}
.mini{color:var(--mu);font-size:13px;padding:6px 0;width:100%;text-align:left}
.sum{display:flex;align-items:center;justify-content:space-between}
.sum b{font-size:22px;display:block}
.sum span{color:var(--mu);font-size:13px}
.hrow{display:flex;align-items:center;gap:12px}
.etile{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--c) 16%,transparent);display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.hm{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb{color:var(--mu);font-size:12.5px;margin-top:1px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--c);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.chk.on{background:var(--c)}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button{width:30px;height:34px;border-radius:10px;background:var(--cell);font-size:18px}
.num{width:64px;text-align:center;border:0;background:none;font-weight:600;outline:none;padding:6px 0}
.tm{border:0;background:var(--cell);border-radius:10px;padding:7px 8px;outline:none;flex:none;width:92px;text-align:center}
.pb{height:5px;background:var(--cell);border-radius:5px;margin-top:11px;overflow:hidden}
.pb i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .25s}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.st{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}
.st b{display:block;font-size:19px;letter-spacing:-.01em}
.st span{color:var(--mu);font-size:12px}
.hmap{display:flex}
.hdays{display:grid;grid-template-rows:14px repeat(7,13px);gap:3px;font-size:10px;line-height:13px;color:var(--mu);margin-right:6px}
.hscroll{overflow-x:auto;scrollbar-width:none;flex:1}
.hscroll::-webkit-scrollbar{display:none}
.hin{width:max-content}
.hlabels{display:flex;gap:3px;height:14px;margin-bottom:3px;font-size:10px;line-height:14px;color:var(--mu)}
.hl{width:13px;white-space:nowrap}
.hgrid{display:flex;gap:3px}
.hw{display:grid;grid-template-rows:repeat(7,13px);gap:3px}
.hc{width:13px;height:13px;border-radius:3px;background:var(--cell);display:block}
.hc.fut{background:none}
.hc.l1{background:color-mix(in srgb,var(--c) 28%,var(--cell))}
.hc.l2{background:color-mix(in srgb,var(--c) 52%,var(--cell))}
.hc.l3{background:color-mix(in srgb,var(--c) 76%,var(--cell))}
.hc.l4{background:var(--c)}
.leg{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:10px;font-size:11px;color:var(--mu)}
.leg .hc{width:11px;height:11px}
.bars{position:relative;display:flex;gap:4px;height:112px}
.bc{flex:1;display:flex;flex-direction:column;align-items:stretch}
.bw{height:92px;display:flex;align-items:flex-end;background:color-mix(in srgb,var(--cell) 55%,transparent);border-radius:5px;overflow:hidden}
.bb{width:100%;border-radius:5px}
.bb.ok{background:var(--c)}
.bb.mid{background:color-mix(in srgb,var(--c) 35%,var(--cell))}
.bc span{font-size:10px;color:var(--mu);text-align:center;margin-top:4px;height:16px;line-height:12px}
.gl{position:absolute;left:0;right:0;border-top:1.5px dashed color-mix(in srgb,var(--tx) 35%,transparent);pointer-events:none}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chead .ib{background:var(--cell);box-shadow:none}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--cell)}
.dots i.on{background:var(--ac)}
.big{font-size:32px;font-weight:700;letter-spacing:-.03em}
.pbar{height:8px;background:var(--cell);border-radius:8px;overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--ac);border-radius:8px}
.pbar i.over{background:var(--dng)}
.stack{display:flex;height:10px;border-radius:10px;overflow:hidden;gap:2px;margin:4px 0 12px}
.stack i{display:block;min-width:3px}
.crow{display:flex;align-items:center;gap:10px;padding:7px 0}
.crow .dot{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.crow .grow b{font-weight:600}
.crow .r{text-align:right;font-weight:600}
.crow .r small{display:block;color:var(--mu);font-weight:400;font-size:12px}
.dg{font-size:12px;color:var(--mu);padding:12px 0 4px;display:flex;justify-content:space-between}
.ex{display:flex;align-items:center;gap:10px;padding:8px 0;width:100%;text-align:left}
.fab{position:fixed;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(88px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;font-size:28px;box-shadow:0 6px 20px rgba(76,110,245,.4);z-index:5}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
#nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);padding:6px 0}
#nav button.on{color:var(--ac)}
#nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:fi .2s}
.sh{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));z-index:21;max-height:88vh;overflow-y:auto;animation:su .25s ease}
.grab{width:38px;height:4px;border-radius:4px;background:var(--cell);margin:0 auto 12px}
.sh label{display:block;font-size:12px;color:var(--mu);margin:12px 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.emo{width:56px;text-align:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:11px;background:var(--cell);font-size:14px}
.chip.on{background:var(--ac);color:#fff}
.chip[data-lock]{opacity:.5}
.chip.on[data-lock]{opacity:.85}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.swb{width:32px;height:32px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px transparent}
.swb.on{box-shadow:0 0 0 2px var(--tx)}
.big-in{font-size:34px!important;font-weight:700;text-align:center;border-width:0!important;background:var(--cell)!important}
textarea.inp{min-height:110px;resize:vertical}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.set .inp{width:110px;text-align:right}
.note{color:var(--mu);font-size:12.5px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.xb{width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.12);margin-left:4px;font-size:14px;line-height:1}
@keyframes fi{from{opacity:0}}
@keyframes su{from{transform:translateY(40px);opacity:0}}
</style>
</head>
<body>
<div id="app"><header id="hdr"></header><main id="main"></main></div>
<nav id="nav"></nav>
<div id="sheetWrap"></div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
/* ---------- Telegram ---------- */
const tg=window.Telegram&&window.Telegram.WebApp;
const inTG=!!(tg&&tg.initData);
try{if(tg){tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();}}catch(e){}
const hap=(t='light')=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t)}catch(e){}};
function applyTheme(){
  const dark=inTG?tg.colorScheme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  document.documentElement.dataset.theme=dark?'dark':'light';
  if(inTG){const bg=dark?'#0e0e10':'#f5f5f3';try{tg.setHeaderColor(bg);tg.setBackgroundColor(bg);tg.setBottomBarColor&&tg.setBottomBarColor(bg)}catch(e){}}
}
applyTheme();
try{inTG?tg.onEvent('themeChanged',applyTheme):matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme)}catch(e){}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONS=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const dow=s=>(pd(s).getDay()+6)%7;
const dfull=d=>{const x=pd(d);return `${WD[dow(d)]}, ${x.getDate()} ${MONG[x.getMonth()]}`};
const dlabel=d=>{const t=today();if(d===t)return 'Сегодня';if(d===addDays(t,-1))return 'Вчера';if(d===addDays(t,1))return 'Завтра';return dfull(d)};
const fmtN=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:1});
const money=n=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2})+'\u00a0'+S.set.cur;
const toMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fmtT=m=>{m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)};
const SW=['#2f9e44','#1c7ed6','#7048e8','#e03131','#f59f00','#0ca678','#d6336c','#495057'];
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900)}
function ask(msg,ok){if(inTG&&tg.showConfirm){tg.showConfirm(msg,r=>{if(r)ok()})}else if(confirm(msg))ok()}
function chunk(s,n){const out=[];let i=0;while(i<s.length){let j=Math.min(i+n,s.length);if(j<s.length){const c=s.charCodeAt(j-1);if(c>=0xD800&&c<=0xDBFF)j--}out.push(s.slice(i,j));i=j}return out}

/* ---------- state ---------- */
const KEY='lifetracker.v1';
const defCats=()=>[
 {id:'food',n:'Еда',e:'🛒',c:'#f76707'},{id:'cafe',n:'Кафе',e:'☕',c:'#f59f00'},
 {id:'transport',n:'Транспорт',e:'🚌',c:'#1c7ed6'},{id:'home',n:'Жильё',e:'🏠',c:'#7048e8'},
 {id:'health',n:'Здоровье',e:'💊',c:'#e03131'},{id:'fun',n:'Развлечения',e:'🎮',c:'#d6336c'},
 {id:'study',n:'Учёба',e:'📚',c:'#0ca678'},{id:'other',n:'Другое',e:'🧾',c:'#868e96'}];
const fresh=()=>({v:1,tasks:[],habits:[],logs:{},expenses:[],cats:defCats(),set:{cur:'€',budget:0},ts:0});
function valid(o){return o&&o.v===1&&Array.isArray(o.tasks)&&Array.isArray(o.habits)&&o.logs&&Array.isArray(o.expenses)&&Array.isArray(o.cats)&&o.set}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(valid(r))return r}catch(e){}return fresh()}
let S=load();
function save(){S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSoon()}
const V={tab:'home',homeView:0,taskTab:'today',habitDate:today(),habitId:null,month:today().slice(0,7),showDone:false};

/* ---------- Telegram CloudStorage backup ---------- */
const cs=()=>(tg&&tg.isVersionAtLeast&&tg.isVersionAtLeast('6.9')&&tg.CloudStorage)||null;
function cloudSave(cb){
  const c=cs();if(!c){cb&&cb(false);return}
  const snap=S.ts;const parts=chunk(JSON.stringify(S),3000);let left=parts.length+1,ok=true;
  const fin=e=>{if(e)ok=false;if(--left===0){if(ok)setSynced(snap);if(cb)cb(ok)}};
  parts.forEach((p,i)=>c.setItem('bk'+i,p,fin));
  c.setItem('bkmeta',JSON.stringify({n:parts.length,ts:S.ts}),fin);
}
function cloudLoad(cb){
  const c=cs();if(!c){cb(null);return}
  c.getItem('bkmeta',(e,m)=>{
    if(e||!m){cb(null);return}
    let meta;try{meta=JSON.parse(m)}catch(_){cb(null);return}
    const keys=[];for(let i=0;i<meta.n;i++)keys.push('bk'+i);
    c.getItems(keys,(e2,r)=>{
      if(e2||!r){cb(null);return}
      try{const o=JSON.parse(keys.map(k=>r[k]||'').join(''));cb(valid(o)?o:null)}catch(_){cb(null)}
    });
  });
}
let ct;function cloudSoon(){if(!cs())return;clearTimeout(ct);ct=setTimeout(()=>cloudSave(),1500)}
const getSynced=()=>{try{return +localStorage.getItem('lifetracker.sync')||0}catch(e){return 0}};
const setSynced=t=>{try{localStorage.setItem('lifetracker.sync',String(t))}catch(e){}};
const persistLocal=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const refresh=()=>{if(!document.querySelector('.sh'))render()};
function mergeState(a,b){
  const hi=a.ts>=b.ts?a:b,lo=hi===a?b:a;
  const out=JSON.parse(JSON.stringify(hi));
  const addMissing=(arr,from)=>{const ids=new Set(arr.map(x=>x.id));from.forEach(x=>{if(!ids.has(x.id))arr.push(x)})};
  addMissing(out.tasks,lo.tasks);addMissing(out.expenses,lo.expenses);addMissing(out.cats,lo.cats);
  const key=h=>h.type+'|'+String(h.name).trim().toLowerCase();
  const map={};
  lo.habits.forEach(h=>{
    const same=out.habits.find(x=>x.id===h.id)||out.habits.find(x=>key(x)===key(h));
    if(same)map[h.id]=same.id;else{out.habits.push(h);map[h.id]=h.id}
  });
  Object.keys(lo.logs).forEach(hid=>{
    const m=map[hid];if(!m)return;const L=out.logs[m]||(out.logs[m]={});
    Object.keys(lo.logs[hid]).forEach(d=>{if(!(d in L))L[d]=lo.logs[hid][d]});
  });
  out.set=Object.assign({},lo.set,hi.set);if(!out.set.budget)out.set.budget=lo.set.budget||0;
  out.v=1;return out;
}
let syncing=false;
function cloudSync(done){
  const c=cs();if(!c){done&&done('off');return}
  if(syncing){done&&done('busy');return}
  syncing=true;const fin=r=>{syncing=false;done&&done(r)};
  const emptyLocal=()=>!S.tasks.length&&!S.habits.length&&!S.expenses.length;
  c.getItem('bkmeta',(e,m)=>{
    if(e){fin('err');return}
    let meta=null;try{meta=m?JSON.parse(m):null}catch(_){}
    const last=getSynced(),localChanged=S.ts!==last;
    if(!meta){if(!emptyLocal())cloudSave(ok=>fin(ok?'pushed':'err'));else fin('same');return}
    const cloudChanged=meta.ts!==last;
    if(!cloudChanged&&!localChanged){fin('same');return}
    if(!cloudChanged){cloudSave(ok=>fin(ok?'pushed':'err'));return}
    cloudLoad(o=>{
      if(!o){fin('err');return}
      if(!localChanged||emptyLocal()){S=o;persistLocal();setSynced(o.ts);refresh();fin('pulled');return}
      S=mergeState(S,o);S.ts=Date.now();persistLocal();refresh();
      cloudSave(ok=>fin(ok?'merged':'err'));
    });
  });
}
const syncNote=r=>{if(r==='pulled'||r==='merged')toast('Данные обновлены из облака')};

/* ---------- habits logic ---------- */
const isNight=h=>h.type==='time'&&(toMin(h.target)>=1080||toMin(h.target)<=240);
const adj=(h,m)=>isNight(h)&&m<720?m+1440:m;
const val=(h,d)=>(S.logs[h.id]||{})[d];
const has=v=>v!=null&&v!=='';
function done(h,d){
  const v=val(h,d);if(!has(v))return false;
  if(h.type==='check')return !!v;
  if(h.type==='count')return +v>=h.goal;
  const m=adj(h,toMin(v)),t=adj(h,toMin(h.target));
  return h.limit==='before'?m<=t:m>=t;
}
function level(h,d){
  const v=val(h,d);if(!has(v))return 0;
  if(h.type==='check')return v?4:0;
  if(h.type==='count'){const r=+v/h.goal;return r<=0?0:r>=1?4:r>=.66?3:r>=.33?2:1}
  return done(h,d)?4:1;
}
function setVal(h,d,v){
  const L=S.logs[h.id]||(S.logs[h.id]={});
  if(!has(v)||(h.type==='check'&&!v))delete L[d];else L[d]=v;
  save();
}
function streak(h){let d=today();if(!done(h,d))d=addDays(d,-1);let n=0;while(done(h,d)&&n<4000){n++;d=addDays(d,-1)}return n}
function bestStreak(h){
  const days=Object.keys(S.logs[h.id]||{}).filter(d=>done(h,d)).sort();let best=0,cur=0,prev=null;
  for(const d of days){cur=prev&&addDays(prev,1)===d?cur+1:1;if(cur>best)best=cur;prev=d}return best;
}
function firstDay(h){return [h.created,...Object.keys(S.logs[h.id]||{})].filter(Boolean).sort()[0]||today()}
function spanDays(h,n){const t0=today();return Math.max(1,Math.min(n,Math.round((pd(t0)-pd(firstDay(h)))/864e5)+1))}
function cntDone(h,n){const t0=today();let c=0;for(let i=0;i<n;i++)if(done(h,addDays(t0,-i)))c++;return c}
function stepOf(h){return h.goal>=5000?1000:h.goal>=1000?500:h.goal>=100?10:1}

/* ---------- heatmap ---------- */
function heat({weeks=30,level,color,act}){
  const end=today();const startMon=addDays(end,-dow(end)-7*(weeks-1));
  let cols='',labels='',lastM=-1;
  for(let w=0;w<weeks;w++){
    const wk=addDays(startMon,w*7);const m=pd(wk).getMonth();
    labels+=`<div class="hl">${m!==lastM?MONS[m]:''}</div>`;lastM=m;
    let cells='';
    for(let r=0;r<7;r++){
      const d=addDays(wk,r);
      if(d>end){cells+='<i class="hc fut"></i>';continue}
      cells+=`<i class="hc l${level(d)}" data-act="${act}" data-d="${d}"></i>`;
    }
    cols+=`<div class="hw">${cells}</div>`;
  }
  const dl=['Пн','','Ср','','Пт','',''].map(x=>`<span>${x}</span>`).join('');
  return `<div class="hmap" style="--c:${color}"><div class="hdays"><span></span>${dl}</div><div class="hscroll"><div class="hin"><div class="hlabels">${labels}</div><div class="hgrid">${cols}</div></div></div></div>
  <div class="leg">меньше <i class="hc"></i><i class="hc l1"></i><i class="hc l2"></i><i class="hc l3"></i><i class="hc l4"></i> больше</div>`;
}
function wbars(arr,color,fmt){
  const mx=Math.max(...arr,0.0001);
  return `<div class="bars" style="--c:${color};height:104px">${arr.map((v,i)=>`<div class="bc"><div class="bw" title="${esc(fmt(v))}"><div class="bb ok" style="height:${v>0?Math.max(6,v/mx*100):0}%"></div></div><span>${WD[i]}</span></div>`).join('')}</div>`;
}

/* ---------- views: home ---------- */
function dayOverall(d,fd){let n=0,m=0;S.habits.forEach(h=>{if(fd[h.id]<=d){m++;if(done(h,d))n++}});return {n,m}}
function homeCard(){
  const v=V.homeView;let sub,inner;
  if(!v){
    sub=S.habits.length?'доля выполненных за день':'пока нет привычек';
    if(!S.habits.length)inner=`<div class="empty" style="padding:24px 0"><button class="btn pri" data-act="nav" data-v="habits">Добавить привычки</button></div>`;
    else{
      const fd={};S.habits.forEach(h=>{fd[h.id]=firstDay(h)});const t0=today();
      const avg=n=>{let s2=0,c=0;for(let i=0;i<n;i++){const o=dayOverall(addDays(t0,-i),fd);if(o.m){s2+=o.n/o.m;c++}}return c?Math.round(s2/c*100):0};
      const td=dayOverall(t0,fd);
      inner=heat({color:'#2f9e44',act:'hmcell',level:d=>{const o=dayOverall(d,fd);if(!o.m||!o.n)return 0;const r=o.n/o.m;return r<.34?1:r<.67?2:r<1?3:4}})
       +`<div class="grid3" style="margin:14px 0 0"><div class="st"><b>${td.n}/${td.m}</b><span>сегодня</span></div><div class="st"><b>${avg(7)}%</b><span>за 7 дней</span></div><div class="st"><b>${avg(30)}%</b><span>за 30 дней</span></div></div>`;
    }
  }else{
    const dm=dayMap(),t0=today(),mon=t0.slice(0,7),ml=monthExp(mon),mt=sumE(ml);
    const nz=Object.values(dm).filter(x=>x>0).sort((a,b)=>a-b);
    const q=nz.length?nz[Math.min(nz.length-1,Math.floor(nz.length*.9))]:1;
    sub=MONN[+mon.slice(5)-1].toLowerCase()+': '+money(mt);
    inner=heat({color:'#f76707',act:'ecell',level:d=>{const x=dm[d]||0;if(!x)return 0;const r=Math.min(1,x/q);return r<.25?1:r<.5?2:r<.8?3:4}})
     +`<div class="grid3" style="margin:14px 0 0"><div class="st"><b>${money(Math.round(dm[t0]||0))}</b><span>сегодня</span></div><div class="st"><b>${money(Math.round(mt))}</b><span>за месяц</span></div><div class="st"><b>${money(Math.round(mt/+t0.slice(8)))}</b><span>в день</span></div></div>`;
  }
  return `<div class="card car"><div class="chead"><button class="ib" data-act="hv" data-n="-1">‹</button><div class="hdt">${v?'Расходы':'Привычки'}<small>${sub}</small></div><button class="ib" data-act="hv" data-n="1">›</button></div>${inner}<div class="dots"><i class="${v?'':'on'}"></i><i class="${v?'on':''}"></i></div></div>`;
}
function homeTasks(){
  const t0=today();
  const groups=[
   ['Сегодня',t=>t.type==='day'&&t.date<=t0&&(!t.done||t.doneAt===t0)],
   ['Завтра',t=>t.type==='day'&&t.date>t0&&!t.done],
   ['Скоро',t=>t.type==='short'&&!t.done],
   ['Долго',t=>t.type==='long'&&!t.done]];
  let h=`<h3 style="margin:18px 4px 10px">Задачи</h3><div class="add"><input id="newTask" class="inp" placeholder="Новая задача на сегодня" maxlength="200" autocomplete="off"><button class="btn pri" data-act="addTask">+</button></div>`;
  groups.forEach(([name,f],i)=>{
    const list=S.tasks.filter(f).sort((a,b)=>(a.done-b.done)||(a.created-b.created));
    if(!list.length&&i>0)return;
    const open=list.filter(t=>!t.done).length;
    h+=`<div class="dg"><span>${name}</span><span>${open}</span></div><div class="card" style="padding:4px 16px">${list.length?list.map(t=>taskItem(t,t0)).join(''):'<div class="sb" style="padding:12px 0">Нет задач на сегодня</div>'}</div>`;
  });
  return h;
}

ACT.copyExp=()=>{const s=JSON.stringify(S);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast('Скопировано'),()=>fallbackCopy(s));else fallbackCopy(s)};
ACT.dlExp=()=>{try{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`life-tracker-${today()}.json`;document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Скачивание недоступно — используй копирование')}};
ACT.impSheet=()=>sheet(`<h2>Импорт</h2><div class="sub" style="margin:-8px 0 10px">Вставь JSON или выбери файл. Текущие данные будут заменены.</div>
  <textarea id="f_imp" class="inp" placeholder="{...}"></textarea><input id="f_file" type="file" accept=".json,application/json" data-chg="impFile" style="margin-top:10px;width:100%">
  <button class="btn pri full" data-act="doImp" style="margin-top:14px">Импортировать</button>`);
CHG.impFile=t=>{const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#f_imp').value=r.result};r.readAsText(f)};
ACT.doImp=()=>{
  let o;try{o=JSON.parse($('#f_imp').value)}catch(e){return toast('Это не похоже на JSON')}
  if(!valid(o))return toast('Неверный формат данных');
  ask('Заменить текущие данные импортированными?',()=>{S=o;save();closeSheet();render();toast('Импортировано')});
};
ACT.idea=()=>{
  const body=encodeURIComponent('## Что изменить или добавить\n\n\n## Зачем / как должно работать\n\n');
  const url='https://github.com/sadlavaw/tracker/issues/new?title='+encodeURIComponent('')+'&body='+body;
  try{if(inTG&&tg.openLink){tg.openLink(url);return}}catch(e){}
  window.open(url,'_blank');
};
ACT.reset=()=>ask('Стереть ВСЕ данные? Это нельзя отменить.',()=>{S=fresh();save();V.habitId=null;render();toast('Данные стёрты')});
ACT.cloudSync=()=>{toast('Синхронизирую…');cloudSync(r=>{toast({same:'Всё уже синхронизировано',pushed:'Отправлено в облако ☁️',pulled:'Загружено из облака',merged:'Данные объединены',err:'Не удалось синхронизировать',off:'Облако Telegram недоступно',busy:'Синхронизация уже идёт'}[r]||'Готово')})};
ACT.cloudSave=()=>{toast('Сохраняю…');cloudSave(ok=>toast(ok?'Сохранено в Telegram ☁️':'Не удалось сохранить'))};
ACT.cloudRestore=()=>cloudLoad(o=>{if(!o)return toast('В облаке ничего нет');ask('Заменить текущие данные копией из Telegram?',()=>{S=o;persistLocal();setSynced(o.ts);render();toast('Загружено из облака')})});

/* ---------- start ---------- */
render();
cloudSync(syncNote);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')cloudSync(syncNote);
  else if(cs()&&S.ts!==getSynced()){clearTimeout(ct);cloudSave()}
});
try{tg&&tg.onEvent&&tg.onEvent('activated',()=>cloudSync(syncNote))}catch(e){}
const VERSION='2026-11-17.4';
try{if(window.fetch)fetch('version.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
  if(j&&j.v&&j.v!==VERSION&&location.search.indexOf('v='+encodeURIComponent(j.v))<0)location.replace(location.pathname+'?v='+encodeURIComponent(j.v));
}).catch(()=>{})}catch(e){}
})();
</script>
</body>
